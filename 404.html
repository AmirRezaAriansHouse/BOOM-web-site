<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه پیدا نشد | باشگاه انفجار BOOM دورود</title>
  <meta name="description" content="صفحه‌ی مورد نظر پیدا نشد. به صفحه‌ی اصلی باشگاه انفجار (BOOM) دورود برگردید.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem('boom-theme') === 'light') {
          document.documentElement.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 18px;
    }
    .nf-code {
      font-size: clamp(4.5rem, 16vw, 8rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--boom-purple, #8b6dff) 0%, var(--boom-gold, #d4af37) 55%, var(--boom-cyan, #22d3ee) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nf-title { font-size: 1.4rem; font-weight: 800; color: var(--boom-white, #fff); margin: 0; }
    .nf-text { max-width: 440px; color: var(--boom-gray, #9c93b0); line-height: 1.9; margin: 0; }
    .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 10px; }
    .nf-logo { height: 52px; margin-bottom: 6px; }
  </style>
</head>
<body class="boom-dark">
  <div class="nf-wrap">
    <img src="assets/images/brand/boom-logo.webp" alt="انفجار BOOM" class="nf-logo">
    <div class="nf-code">۴۰۴</div>
    <p class="nf-title">این صفحه پیدا نشد</p>
    <p class="nf-text">
      ظاهراً صفحه‌ای که دنبالش بودید حذف شده یا آدرسش تغییر کرده. می‌تونید به صفحه‌ی اصلی باشگاه انفجار BOOM برگردید یا مقالات مجله رو ببینید.
    </p>
    <div class="nf-actions">
      <a href="/" class="btn btn-gold">بازگشت به صفحه اصلی</a>
      <a href="/magazine.html" class="btn btn-primary">مجله BOOM</a>
    </div>
  </div>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
